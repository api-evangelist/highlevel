components:
  schemas:
    SocialMediaTiktokAccountResponseDTO:
      type: object
      properties:
        success:
          type: boolean
          description: Success or Failure
          example: true
        statusCode:
          type: number
          description: Status Code
          example: 201
        message:
          type: string
          description: Message
          example: Added Tiktok Account
        results:
          description: Requested Results
          allOf:
          - $ref: '#/components/schemas/SocialMediaTiktokAccountSchema'
      required:
      - success
      - statusCode
      - message
    SocialMediaTiktokAccountSchema:
      type: object
      properties:
        _id:
          type: string
          example: 65f2d989a4f2f1e5322c3856
        oAuthId:
          type: string
          example: u37swmmLbA02zgqKPpxITe2
        oldId:
          type: string
          example: u37swmmLbA02zgqKPpxITe2
        locationId:
          type: string
          example: u37swmmLbA02zgqKPpxITe2
        originId:
          type: string
          example: u37swmmLbA02zgqKPpxITe2
        platform:
          type: object
          example: tiktok
        type:
          type: object
          description: 'type must be one of the following values: profile, business'
          example: profile
        name:
          type: string
          example: Account Name
        avatar:
          type: string
          example: u37swmmLbA02zgqKPpxITe2
        meta:
          type: object
          example:
            pageId: u37swmmLbA02zgqKPpxITe2
            page:
              id: u37swmmLbA02zgqKPpxITe2
              name: Account Name
              avatar: u37swmmLbA02zgqKPpxITe2
            storeCode: '122'
            isVerified: 'true'
            verified: true
            protected: true
            locationId: u37swmmLbA02zgqKPpxITe2
            accountId: u37swmmLbA02zgqKPpxITe2
            openId: u37swmmLbA02zgqKPpxITe2
            urn: u37swmmLbA02zgqKPpxITe2
            username: testUser
            storefrontAddress:
              regionCode: '30021'
              languageCode: E001
              postalCode: '1221'
              administrativeArea: Down Town
              locality: Louis Street
              addressLines:
              - '207'
              - county
        active:
          type: boolean
          example: true
        deleted:
          type: boolean
          example: true
        createdAt:
          format: date-time
          type: string
          description: created date
          example: '2024-03-14T11:03:37.015Z'
        updatedAt:
          format: date-time
          type: string
          description: updated date
          example: '2024-03-14T11:03:37.015Z'
    TiktokProfileSchema:
      type: object
      properties:
        id:
          type: string
          description: Id
          example: w37swmmLbA02zgqKPpxITe
        name:
          type: string
          description: Name of account
          example: Account Name
        username:
          type: string
          description: Username of account
          example: User_name
        avatar:
          type: string
          description: Avatar of profile account
          example: w37swmmLbA02zgqKPpxITe
        verified:
          type: boolean
          description: Is verified
          example: true
        isConnected:
          type: boolean
          description: Is connected
          example: true
        type:
          type: object
          description: 'Tiktok Account Type must be one of the following values: business, profile'
          example: BUSINESS
    AttachTiktokAccountDTO:
      type: object
      properties:
        type:
          type: string
          enum:
          - page
          - group
          - profile
          - location
          - business
        originId:
          type: string
          example: 244405****11687
        name:
          type: string
          example: JOHN_DEO
        avatar:
          type: string
        verified:
          type: boolean
          example: true
        username:
          type: string
          example: JOHN_DEO
        companyId:
          type: string
          description: Company ID
          example: sdfdsfdsfEWEsdfsdsW32dd
    GetTiktokAccountResponseDTO:
      type: object
      properties:
        success:
          type: boolean
          description: Success or Failure
          example: true
        statusCode:
          type: number
          description: Status Code
          example: 200
        message:
          type: string
          description: Message
          example: Fetched Tiktok Account
        results:
          description: Requested Results
          allOf:
          - $ref: '#/components/schemas/GetTiktokAccountSchema'
      required:
      - success
      - statusCode
      - message
    GetTiktokBusinessAccountResponseDTO:
      type: object
      properties:
        success:
          type: boolean
          description: Success or Failure
          example: true
        statusCode:
          type: number
          description: Status Code
          example: 201
        message:
          type: string
          description: Message
          example: Fetched Tiktok Business Account
        results:
          description: Requested Results
          allOf:
          - $ref: '#/components/schemas/GetTiktokBusinessAccountSchema'
      required:
      - success
      - statusCode
      - message
    GetTiktokBusinessAccountSchema:
      type: object
      properties:
        profile:
          description: Tiktok Profile
          type: array
          items:
            $ref: '#/components/schemas/TiktokProfileSchema'
    GetTiktokAccountSchema:
      type: object
      properties:
        profile:
          description: Tiktok Business Account
          type: array
          items:
            $ref: '#/components/schemas/TiktokProfileSchema'
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Sub-Account (OR) Private Integration Token of Sub-Account.
      type: http
    Location-Access:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Sub-Account (OR) Private Integration Token of Sub-Account.
      type: http
    Agency-Access:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Agency (OR) Private Integration Token of Agency.
      type: http
x-tagGroups:
  name: Social Planner
  tags:
