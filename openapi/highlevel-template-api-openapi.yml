openapi: 3.2.0
info:
  title: Highlevel Template API
  version: '1.0'
  contact: {}
  description: 'Operations tagged Template across 2 of this provider''s published API definitions: highlevel-invoices-openapi.json, highlevel-locations-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://services.leadconnectorhq.com
tags:
- name: Template
  description: Documentation for invoice API
paths:
  /invoices/template:
    post:
      operationId: create-invoice-template
      summary: Create template
      description: API to create a template
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceTemplateDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceTemplateResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Template
      security:
      - Location-Access:
        - invoices/template.write
      - Agency-Access:
        - invoices/template.write
    get:
      operationId: list-invoice-templates
      summary: List templates
      description: API to get list of templates
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: altId
        required: true
        in: query
        description: location Id / company Id based on altType
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      - name: altType
        required: true
        in: query
        description: Alt Type
        schema:
          example: location
          enum:
          - location
          type: string
      - name: status
        required: false
        in: query
        description: status to be filtered
        schema:
          type: string
      - name: startAt
        required: false
        in: query
        description: startAt in YYYY-MM-DD format
        schema:
          example: '2023-01-01'
          type: string
      - name: endAt
        required: false
        in: query
        description: endAt in YYYY-MM-DD format
        schema:
          example: '2023-01-01'
          type: string
      - name: search
        required: false
        in: query
        description: To search for an invoice by id / name / email / phoneNo
        schema:
          example: Alex
          type: string
      - name: paymentMode
        required: false
        in: query
        description: payment mode
        schema:
          example: live
          enum:
          - default
          - live
          - test
          type: string
      - name: limit
        required: true
        in: query
        description: Limit the number of items to return
        schema:
          example: 10
          type: string
      - name: offset
        required: true
        in: query
        description: Number of items to skip
        schema:
          example: 10
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTemplatesResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Template
      security:
      - Location-Access:
        - invoices/template.readonly
      - Agency-Access:
        - invoices/template.readonly
    servers:
    - url: https://services.leadconnectorhq.com
  /invoices/template/{templateId}:
    get:
      operationId: get-invoice-template
      summary: Get an template
      description: API to get an template by template id
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: templateId
        required: true
        in: path
        description: Template Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      - name: altId
        required: true
        in: query
        description: location Id / company Id based on altType
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      - name: altType
        required: true
        in: query
        description: Alt Type
        schema:
          example: location
          enum:
          - location
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTemplateResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Template
      security:
      - Location-Access:
        - invoices/template.readonly
      - Agency-Access:
        - invoices/template.readonly
    put:
      operationId: update-invoice-template
      summary: Update template
      description: API to update an template by template id
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: templateId
        required: true
        in: path
        description: Template Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceTemplateDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInvoiceTemplateResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Template
      security:
      - Location-Access:
        - invoices/template.write
      - Agency-Access:
        - invoices/template.write
    delete:
      operationId: delete-invoice-template
      summary: Delete template
      description: API to update an template by template id
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: templateId
        required: true
        in: path
        description: Template Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      - name: altId
        required: true
        in: query
        description: location Id / company Id based on altType
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      - name: altType
        required: true
        in: query
        description: Alt Type
        schema:
          example: location
          enum:
          - location
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInvoiceTemplateResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Template
      security:
      - Location-Access:
        - invoices/template.write
      - Agency-Access:
        - invoices/template.write
    servers:
    - url: https://services.leadconnectorhq.com
  /invoices/template/{templateId}/late-fees-configuration:
    patch:
      operationId: update-invoice-template-late-fees-configuration
      summary: Update template late fees configuration
      description: API to update template late fees configuration by template id
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: templateId
        required: true
        in: path
        description: Template Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceLateFeesConfigurationDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInvoiceTemplateResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Template
      security:
      - Location-Access: []
      - Agency-Access: []
    servers:
    - url: https://services.leadconnectorhq.com
  /invoices/template/{templateId}/payment-methods-configuration:
    patch:
      operationId: update-invoice-payment-methods-configuration
      summary: Update template late fees configuration
      description: API to update template late fees configuration by template id
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: templateId
        required: true
        in: path
        description: Template Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentMethodsConfigurationDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInvoiceTemplateResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Template
      security:
      - Location-Access: []
      - Agency-Access: []
    servers:
    - url: https://services.leadconnectorhq.com
  /locations/{locationId}/templates:
    get:
      operationId: GET-all-or-email-sms-templates
      summary: GET all or email/sms templates
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: deleted
        required: false
        in: query
        example: false
        schema:
          default: false
          type: boolean
      - name: skip
        required: false
        in: query
        example: '1'
        schema:
          default: '0'
          type: string
      - name: limit
        required: false
        in: query
        example: '25'
        schema:
          default: '25'
          type: string
      - name: type
        required: false
        in: query
        schema:
          enum:
          - sms
          - email
          - whatsapp
          type: string
      - name: originId
        required: true
        in: query
        description: Origin Id
        example: ve9EPM428h8vShlRW1KT
        schema:
          type: string
      - name: locationId
        required: true
        in: path
        description: Location Id
        example: ve9EPM428h8vShlRW1KT
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTemplatesSuccessfulResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Template
      security:
      - bearer:
        - locations/templates.readonly
    servers:
    - url: https://services.leadconnectorhq.com
  /locations/{locationId}/templates/{id}:
    delete:
      operationId: DELETE-an-email-sms-template
      summary: DELETE an email/sms template
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: locationId
        required: true
        in: path
        description: Location Id
        example: ve9EPM428h8vShlRW1KT
        schema:
          type: string
      - name: id
        required: true
        in: path
        description: Template Id
        example: ve9EPM428h8vShlRW1KT
        schema:
          type: string
      responses:
        '200':
          description: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Template
      security:
      - bearer: []
    servers:
    - url: https://services.leadconnectorhq.com
components:
  schemas:
    BusinessDetailsDto:
      type: object
      properties:
        logoUrl:
          type: string
          description: Business Logo URL
          example: https://example.com/logo.png
        name:
          type: string
          description: Business Name
          example: ABC Corp.
        phoneNo:
          type: string
          description: Business Phone Number
          example: +1-214-559-6993
        address:
          description: Business Address
          example: 9931 Beechwood, TX
          allOf:
          - $ref: '#/components/schemas/AddressDto'
        website:
          type: string
          description: Business Website Link
          example: wwww.example.com
        customValues:
          description: Custom Values
          type: array
          items:
            type: string
    UpdatePaymentMethodsConfigurationDto:
      type: object
      properties:
        altId:
          type: string
          description: location Id / company Id based on altType
          example: 6578278e879ad2646715ba9c
        altType:
          type: string
          description: Alt Type
          enum:
          - location
          example: location
        paymentMethods:
          description: Payment Methods for Invoices
          allOf:
          - $ref: '#/components/schemas/PaymentMethodDto'
      required:
      - altId
      - altType
    PaymentMethodDto:
      type: object
      properties:
        stripe:
          description: Payment Method
          allOf:
          - $ref: '#/components/schemas/StripePaymentMethodDto'
      required:
      - stripe
    InvoiceItemDto:
      type: object
      properties:
        name:
          type: string
          description: Invoice Item Name
          example: ABC Product
        description:
          type: string
          description: Invoice descriptions
          example: ABC Corp.
        productId:
          type: string
          description: Product Id
          example: 6578278e879ad2646715ba9c
        priceId:
          type: string
          description: Price Id
          example: 6578278e879ad2646715ba9c
        currency:
          type: string
          description: Currency
          example: USD
        amount:
          type: number
          description: Product amount
          example: 999
        qty:
          type: number
          description: Product Quantity
          example: 1
        taxes:
          description: Tax
          type: array
          items:
            $ref: '#/components/schemas/ItemTaxDto'
        automaticTaxCategoryId:
          type: string
          description: Tax category id for calculating automatic tax
          example: 6578278e879ad2646715ba9c
        isSetupFeeItem:
          type: boolean
          description: Setupfee item, only created when 1st invoice of recurring schedule is generated
        type:
          type: string
          description: Price type of the item
          example: one_time
          enum:
          - one_time
          - recurring
        taxInclusive:
          type: boolean
          description: true if item amount is tax inclusive
          example: true
          default: false
      required:
      - name
      - currency
      - amount
      - qty
    LateFeesGraceDto:
      type: object
      properties:
        intervalCount:
          type: number
          description: Late fees grace interval count
          example: 10
        interval:
          type: string
          description: Late fees grace interval
          example: day
          enum:
          - day
      required:
      - intervalCount
      - interval
    GetTemplateResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: Template Id
          example: 6578278e879ad2646715ba9c
        altId:
          type: string
          description: Location Id or Agency Id
          example: 6578278e879ad2646715ba9c
        altType:
          type: string
          enum:
          - location
        name:
          type: string
          description: Name of the Template
          example: New Template
        businessDetails:
          description: Business Details
          example:
            name: Alex
            address:
              addressLine1: 9931 Beechwood
              city: St. Houston
              state: TX
              countryCode: USA
              postalCode: 559-6993
            phoneNo: +1-214-559-6993
            website: www.example.com
          allOf:
          - $ref: '#/components/schemas/BusinessDetailsDto'
        currency:
          type: string
          description: Currency
          example: USD
        discount:
          description: Discount
          example:
            type: percentage
            value: 0
          allOf:
          - $ref: '#/components/schemas/DiscountDto'
        items:
          description: Invoice Items
          example:
          - taxes: []
            _id: c6tZZU0rJBf30ZXx9Gli
            productId: c6tZZU0rJBf30ZXx9Gli
            priceId: c6tZZU0rJBf30ZXx9Gli
            currency: USD
            name: Macbook Pro
            qty: 1
            amount: 999
          type: array
          items:
            type: string
        invoiceNumberPrefix:
          type: string
          description: prefix for invoice number
          example: INV-
        total:
          type: number
          description: Total Amount
          example: 999
        createdAt:
          type: string
          description: created at
          example: '2023-12-12T09:27:42.355Z'
        updatedAt:
          type: string
          description: updated at
          example: '2023-12-12T09:27:42.355Z'
      required:
      - _id
      - altId
      - altType
      - name
      - businessDetails
      - currency
      - items
      - total
      - createdAt
      - updatedAt
    LateFeesFrequencyDto:
      type: object
      properties:
        intervalCount:
          type: number
          description: Late fees interval count
          example: 10
        interval:
          type: string
          description: Late fees interval
          example: day
          enum:
          - minute
          - hour
          - day
          - week
          - month
          - one_time
      required:
      - intervalCount
      - interval
    UpdateInvoiceTemplateResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: Template Id
          example: 6578278e879ad2646715ba9c
        altId:
          type: string
          description: Location Id or Agency Id
          example: 6578278e879ad2646715ba9c
        altType:
          type: string
          enum:
          - location
        name:
          type: string
          description: Name of the Template
          example: New Template
        businessDetails:
          description: Business Details
          example:
            name: Alex
            address:
              addressLine1: 9931 Beechwood
              city: St. Houston
              state: TX
              countryCode: USA
              postalCode: 559-6993
            phoneNo: +1-214-559-6993
            website: www.example.com
          allOf:
          - $ref: '#/components/schemas/BusinessDetailsDto'
        currency:
          type: string
          description: Currency
          example: USD
        discount:
          description: Discount
          example:
            type: percentage
            value: 0
          allOf:
          - $ref: '#/components/schemas/DiscountDto'
        items:
          description: Invoice Items
          example:
          - taxes: []
            _id: c6tZZU0rJBf30ZXx9Gli
            productId: c6tZZU0rJBf30ZXx9Gli
            priceId: c6tZZU0rJBf30ZXx9Gli
            currency: USD
            name: Macbook Pro
            qty: 1
            amount: 999
          type: array
          items:
            type: string
        invoiceNumberPrefix:
          type: string
          description: prefix for invoice number
          example: INV-
        total:
          type: number
          description: Total Amount
          example: 999
        createdAt:
          type: string
          description: created at
          example: '2023-12-12T09:27:42.355Z'
        updatedAt:
          type: string
          description: updated at
          example: '2023-12-12T09:27:42.355Z'
      required:
      - _id
      - altId
      - altType
      - name
      - businessDetails
      - currency
      - items
      - total
      - createdAt
      - updatedAt
    ProcessingFeeDto:
      type: object
      properties:
        charges:
          description: charges for the processing fee
          items:
            type: array
          type: array
        collectedMiscellaneousCharges:
          type: number
          description: collected miscellaneous charges
          example: 10
        paidCharges:
          description: paid miscellaneous charges
          type: array
          items:
            $ref: '#/components/schemas/ProcessingFeePaidChargeDto'
      required:
      - charges
    StripePaymentMethodDto:
      type: object
      properties:
        enableBankDebitOnly:
          type: boolean
          description: Enable Bank Debit Only
          example: false
      required:
      - enableBankDebitOnly
    UpdateInvoiceLateFeesConfigurationDto:
      type: object
      properties:
        altId:
          type: string
          description: location Id / company Id based on altType
          example: 6578278e879ad2646715ba9c
        altType:
          type: string
          description: Alt Type
          enum:
          - location
          example: location
        lateFeesConfiguration:
          description: late fees configuration
          allOf:
          - $ref: '#/components/schemas/LateFeesConfigurationDto'
      required:
      - altId
      - altType
      - lateFeesConfiguration
    DeleteInvoiceTemplateResponseDto:
      type: object
      properties:
        success:
          type: boolean
          description: success
          example: true
      required:
      - success
    DiscountDto:
      type: object
      properties:
        value:
          type: number
          description: Discount Value
          example: 10
          default: 0
        type:
          type: string
          description: Discount type
          enum:
          - percentage
          - fixed
          example: percentage
          default: percentage
        validOnProductIds:
