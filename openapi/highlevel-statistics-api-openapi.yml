                            value: 0
                            change: 0
                      engagement:
                        google:
                          likes: 0
                          comments: 0
                          shares: 0
                          change: 0
                    platformTotals:
                      impressions:
                        google:
                          total: 0
                          series:
                          - 0
                          - 0
                          - 0
                          - 0
                          - 0
                          - 0
                          - 0
                      followers:
                        google:
                          total: 0
                          series:
                          - 0
                          - 0
                          - 0
                          - 0
                          - 0
                          - 0
                          - 0
                      likes:
                        google:
                          total: 0
                          series:
                          - 0
                          - 0
                          - 0
                          - 0
                          - 0
                          - 0
                          - 0
                    demographics:
                      gender:
                        totals:
                          male:
                            total: 0
                            percentage: 0
                          female:
                            total: 0
                            percentage: 0
                          unknown:
                            total: 0
                            percentage: 0
                      age:
                        totals:
                          13-17: 0
                          18-24: 0
                          25-34: 0
                          35-44: 0
                          45-54: 0
                          55-64: 0
                          65+: 0
                  message: Analytics Built Successfully
                  traceId: 42fc8dd8-d55b-475f-944f-9efb90d77564
        '400':
          description: Bad Request - Occurs when more than 100 accounts are requested or invalid parameters are provided
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized - Invalid or missing authentication credentials
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity - Invalid request body format
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Statistics
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Sub-Account (OR) Private Integration Token of Sub-Account.
      type: http
    Location-Access:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Sub-Account (OR) Private Integration Token of Sub-Account.
      type: http
    Agency-Access:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Agency (OR) Private Integration Token of Agency.
      type: http
