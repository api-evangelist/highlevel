                      - 0
                      - 0
                      - 0
                    breakdowns:
                      posts:
                        total: 0
                        totalChange: 0
                        platforms:
                          google:
                            value: 0
                            change: 0
                      impressions:
                        total: 0
                        totalChange: 0
                        platforms:
                          google:
                            value: 0
