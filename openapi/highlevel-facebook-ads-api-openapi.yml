  /ad-publishing/facebook/targeting/search:
    get:
      operationId: fb-search-targeting
      summary: Search targeting options
      description: Search Facebook geo-locations and interests for ad targeting
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
          example: '2021-07-28'
      - name: type
        required: true
        in: query
        description: Targeting search type
        schema:
          example: interest
          type: string
      - name: query
        required: true
        in: query
        description: Search query string
        schema:
          example: fitness
          type: string
      - name: searchType
        required: false
        in: query
        description: Specific search subtype
        schema:
          example: adgeolocation
          type: string
      responses:
        '200':
          description: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      security:
      - bearer: []
      tags:
      - Facebook Ads
