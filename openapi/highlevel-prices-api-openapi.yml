    InventoryItemDto:
      type: object
      properties:
        _id:
          type: string
          description: The unique identifier for the price
          example: 6241712be68f7a98102ba272
        name:
          type: string
          description: Name of the price/variant
          example: Medium T-shirt
        availableQuantity:
          type: number
