        description: Location identifier
        schema:
          example: loc_abc123
          type: string
      - name: fetchExisting
        required: false
        in: query
        description: Fetch existing pages flag
        schema:
          example: 'true'
          type: string
      responses:
        '200':
          description: ''
        '400':
