components:
  schemas:
    CustomDisclaimerCheckbox:
      type: object
      properties:
        is_required:
          type: boolean
          description: Checkbox required flag
          example: true
        text:
          type: string
          description: Checkbox text label
          example: I agree to terms
        key:
          type: string
          description: Checkbox unique key
          example: terms_checkbox
      required:
      - is_required
      - text
      - key
    CustomDisclaimer:
      type: object
      properties:
        title:
          type: string
          description: Disclaimer title
          example: Terms & Conditions
        body:
          type: string
          description: Disclaimer body text
          example: By submitting...
        checkboxes:
          description: Consent checkboxes the user must agree to before submitting the form
          example:
          - is_required: true
            text: I agree to the Terms & Conditions
            key: terms_checkbox
          - is_required: false
            text: I would like to receive marketing emails
            key: marketing_optin
          type: array
          items:
            $ref: '#/components/schemas/CustomDisclaimerCheckbox'
      required:
      - title
      - body
    WelcomeMessageQuestion:
      type: object
      properties:
        question:
          type: string
          description: Question title text
          example: How can we help?
        response:
          type: string
          description: Auto-response message
          example: Thanks for reaching out
      required:
      - question
    LocationIdBodyDTO:
      type: object
      properties:
        locationId:
          type: string
          description: Location identifier
          example: HChooFuiyPpVYzeJ4HMe
      required:
      - locationId
    CreateConversationFormDTO:
      type: object
      properties:
        locationId:
          type: string
          description: Location identifier
          example: loc_abc123
        name:
          type: string
          description: Conversation form name
          example: Welcome Form
        text:
          type: string
          description: Welcome message text
          example: Hi! How can we help?
        questions:
          description: Quick-reply questions shown in the welcome message of the conversation form
          example:
          - question: How can we help?
            response: Thanks for reaching out! A team member will assist you shortly.
          - question: I want to learn more
            response: Great! Here is a link to our services.
          type: array
          items:
            $ref: '#/components/schemas/WelcomeMessageQuestion'
      required:
      - locationId
      - name
      - text
      - questions
    GreetingCard:
      type: object
      properties:
        title:
          type: string
          description: Greeting card title
          example: Welcome!
        style:
          type: string
          description: Greeting card style
          example: LIST_STYLE
        content:
          description: Greeting card content
          example:
          - Learn more about our services
          type: array
          items:
            type: string
      required:
      - title
      - style
      - content
    ThankYouPage:
      type: object
      properties:
        title:
          type: string
          description: Thank you page title
          example: Thank You!
        body:
          type: string
          description: Thank you page body
          example: We will contact you soon
        buttonText:
          type: string
          description: Button text label
          example: Visit Website
        buttonType:
          type: string
          description: Button action type
          example: VIEW_WEBSITE
        buttonLink:
          type: string
          description: Button destination link
          example: https://example.com
        businessPhone:
          type: string
          description: Business phone number
          example: '+1234567890'
        countryCode:
          type: string
          description: Phone country code
          example: US
      required:
      - title
      - body
      - buttonText
      - buttonType
    CreateIntegrationDTO:
      type: object
      properties:
        locationId:
          type: string
          description: Location identifier
          example: loc_abc123
        pageId:
          type: string
          description: Facebook page ID
          example: '123456789'
        adAccountId:
          type: string
          description: Ad account identifier
          example: act_123456
      required:
      - locationId
      - pageId
    FormQuestion:
      type: object
      properties:
        label:
          type: string
          description: Question label text shown to the user
          example: What is your name?
        key:
          type: string
          description: Question key
          example: name
        type:
          type: string
          description: Question input type — use a prefilled type for standard fields or CUSTOM / SHORT_ANSWER for freeform questions
          example: SHORT_ANSWER
          enum:
          - CUSTOM
          - CITY
          - COMPANY_NAME
          - COUNTRY
          - DATE_OF_BIRTH
          - EMAIL
          - FIRST_NAME
          - FULL_NAME
          - GENDER
          - JOB_TITLE
          - LAST_NAME
          - MARITAL_STATUS
          - MILITARY_STATUS
          - PHONE
          - POST_CODE
          - RELATIONSHIP_STATUS
          - STATE
          - STREET_ADDRESS
          - WORK_EMAIL
          - WORK_PHONE_NUMBER
          - ZIP
          - SHORT_ANSWER
        options:
          description: Answer options for multiple-choice questions (only applies to CUSTOM type)
          example:
          - value: 'Yes'
          - value: 'No'
          type: array
          items:
            $ref: '#/components/schemas/FormQuestionOption'
      required:
      - key
      - type
    FbSetDefaultPageBodyDTO:
      type: object
      properties:
        pageId:
          type: string
          description: Facebook page identifier
          example: '103456789012345'
      required:
      - pageId
    FormQuestionOption:
      type: object
      properties:
        key:
          type: string
          description: Option key
          example: option 1
        value:
          type: string
          description: Option value
          example: Option 1
      required:
      - key
      - value
    CreateLeadFormDTO:
      type: object
      properties:
        type:
          type: string
          description: Lead form type
          example: MORE_VOLUME
          enum:
          - MORE_VOLUME
          - HIGHER_INTENT
        name:
          type: string
          description: Lead form name
          example: Contact Form
        locationId:
          type: string
          description: Location identifier
          example: loc_abc123
        greetingCard:
          description: Greeting card config
          allOf:
          - $ref: '#/components/schemas/GreetingCard'
        questions:
          description: List of questions displayed on the lead form
          example:
          - key: full_name
            type: FULL_NAME
            options: []
          - key: email_address
            type: EMAIL
            options: []
          - key: are_you_interested
            label: Are you interested?
            type: CUSTOM
            options:
            - value: 'Yes'
            - value: 'No'
          type: array
          items:
            $ref: '#/components/schemas/FormQuestion'
        questionPageHeadline:
          type: string
          description: Question page headline
          example: Tell us about yourself
        privacyPolicyLink:
          type: string
          description: Privacy policy URL
          example: https://example.com/privacy
        privacyPolicyText:
          type: string
          description: Privacy policy text
          example: We respect your privacy
        customDisclaimer:
          description: Custom disclaimer config
          allOf:
          - $ref: '#/components/schemas/CustomDisclaimer'
        thankYouPage:
          description: Thank you page config
          allOf:
          - $ref: '#/components/schemas/ThankYouPage'
      required:
      - type
      - name
      - locationId
      - questions
      - privacyPolicyLink
      - thankYouPage
