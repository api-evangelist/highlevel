openapi: 3.2.0
info:
  title: Invoice Schedule API
  description: Documentation for invoice API
  version: '1.0'
  contact: {}
servers:
- url: https://services.leadconnectorhq.com
tags:
- name: Schedule
  description: Documentation for invoice API
paths:
  /invoices/schedule:
    post:
      operationId: create-invoice-schedule
      summary: Create Invoice Schedule
      description: API to create an invoice Schedule
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceScheduleDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceScheduleResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Schedule
      security:
      - Location-Access:
        - invoices/schedule.write
      - Agency-Access:
        - invoices/schedule.write
    get:
      operationId: list-invoice-schedules
      summary: List schedules
      description: API to get list of schedules
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: altId
        required: true
        in: query
        description: location Id / company Id based on altType
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      - name: altType
        required: true
        in: query
        description: Alt Type
        schema:
          example: location
          enum:
          - location
          type: string
      - name: status
        required: false
        in: query
        description: status to be filtered
        schema:
          type: string
      - name: startAt
        required: false
        in: query
        description: startAt in YYYY-MM-DD format
        schema:
          example: '2023-01-01'
          type: string
      - name: endAt
        required: false
        in: query
        description: endAt in YYYY-MM-DD format
        schema:
          example: '2023-01-01'
          type: string
      - name: search
        required: false
        in: query
        description: To search for an invoice by id / name / email / phoneNo
        schema:
          example: Alex
          type: string
      - name: paymentMode
        required: false
        in: query
        description: payment mode
        schema:
          example: live
          enum:
          - default
          - live
          - test
          type: string
      - name: limit
        required: true
        in: query
        description: Limit the number of items to return
        schema:
          example: 10
          type: string
      - name: offset
        required: true
        in: query
        description: Number of items to skip
        schema:
          example: 10
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSchedulesResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Schedule
      security:
      - Location-Access:
        - invoices/schedule.readonly
      - Agency-Access:
        - invoices/schedule.readonly
  /invoices/schedule/{scheduleId}:
    get:
      operationId: get-invoice-schedule
      summary: Get an schedule
      description: API to get an schedule by schedule id
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: scheduleId
        required: true
        in: path
        description: Schedule Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      - name: altId
        required: true
        in: query
        description: location Id / company Id based on altType
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      - name: altType
        required: true
        in: query
        description: Alt Type
        schema:
          example: location
          enum:
          - location
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetScheduleResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Schedule
      security:
      - Location-Access:
        - invoices/schedule.readonly
      - Agency-Access:
        - invoices/schedule.readonly
    put:
      operationId: update-invoice-schedule
      summary: Update schedule
      description: API to update an schedule by schedule id
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: scheduleId
        required: true
        in: path
        description: Schedule Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceScheduleDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInvoiceScheduleResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Schedule
      security:
      - Location-Access:
        - invoices/schedule.write
      - Agency-Access:
        - invoices/schedule.write
    delete:
      operationId: delete-invoice-schedule
      summary: Delete schedule
      description: API to delete an schedule by schedule id
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: scheduleId
        required: true
        in: path
        description: Schedule Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      - name: altId
        required: true
        in: query
        description: location Id / company Id based on altType
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      - name: altType
        required: true
        in: query
        description: Alt Type
        schema:
          example: location
          enum:
          - location
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInvoiceScheduleResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Schedule
      security:
      - Location-Access:
        - invoices/schedule.write
      - Agency-Access:
        - invoices/schedule.write
  /invoices/schedule/{scheduleId}/updateAndSchedule:
    post:
      operationId: update-and-schedule-invoice-schedule
      summary: Update scheduled recurring invoice
      description: API to update scheduled recurring invoice
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: scheduleId
        required: true
        in: path
        description: Schedule Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAndScheduleInvoiceScheduleResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Schedule
      security:
      - Location-Access:
        - invoices/schedule.write
      - Agency-Access:
        - invoices/schedule.write
  /invoices/schedule/{scheduleId}/schedule:
    post:
      operationId: schedule-invoice-schedule
      summary: Schedule an schedule invoice
      description: API to schedule an schedule invoice to start sending to the customer
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: scheduleId
        required: true
        in: path
        description: Schedule Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInvoiceScheduleDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleInvoiceScheduleResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Schedule
      security:
      - Location-Access:
        - invoices/schedule.write
      - Agency-Access:
        - invoices/schedule.write
  /invoices/schedule/{scheduleId}/auto-payment:
    post:
      operationId: auto-payment-invoice-schedule
      summary: Manage Auto payment for an schedule invoice
      description: API to manage auto payment for a schedule
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: scheduleId
        required: true
        in: path
        description: Schedule Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoPaymentScheduleDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoPaymentInvoiceScheduleResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Schedule
      security:
      - Location-Access:
        - invoices/schedule.write
      - Agency-Access:
        - invoices/schedule.write
  /invoices/schedule/{scheduleId}/cancel:
    post:
      operationId: cancel-invoice-schedule
      summary: Cancel an scheduled invoice
      description: API to cancel a scheduled invoice by schedule id
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
      - name: scheduleId
        required: true
        in: path
        description: Schedule Id
        schema:
          example: 6578278e879ad2646715ba9c
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInvoiceScheduleDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelInvoiceScheduleResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      tags:
      - Schedule
      security:
      - Location-Access:
        - invoices/schedule.write
      - Agency-Access:
        - invoices/schedule.write
components:
  schemas:
    BusinessDetailsDto:
      type: object
      properties:
        logoUrl:
          type: string
          description: Business Logo URL
          example: https://example.com/logo.png
        name:
          type: string
          description: Business Name
          example: ABC Corp.
        phoneNo:
          type: string
          description: Business Phone Number
          example: +1-214-559-6993
        address:
          description: Business Address
          example: 9931 Beechwood, TX
          allOf:
          - $ref: '#/components/schemas/AddressDto'
        website:
          type: string
          description: Business Website Link
          example: wwww.example.com
        customValues:
          description: Custom Values
          type: array
          items:
            type: string
    AutoPaymentDetailsDto:
      type: object
      properties:
        enable:
          type: boolean
        type:
          type: string
        paymentMethodId:
          type: string
        customerId:
          type: string
        card:
          $ref: '#/components/schemas/CardDto'
        usBankAccount:
          $ref: '#/components/schemas/USBankAccountDto'
        sepaDirectDebit:
          $ref: '#/components/schemas/SepaDirectDebitDTO'
        bacsDirectDebit:
          $ref: '#/components/schemas/BacsDirectDebitDTO'
        becsDirectDebit:
          $ref: '#/components/schemas/BecsDirectDebitDTO'
        cardId:
          type: string
        provider:
          type: object
      required:
      - enable
    AdditionalEmailsDto:
      type: object
      properties:
        email:
          type: string
          example: alex@example.com
      required:
      - email
    GetScheduleResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: Schedule Id
          example: 6578278e879ad2646715ba9c
        status:
          type: object
          description: Schedule Status
          example: draft
        liveMode:
          type: boolean
          description: Live Mode
          example: false
        altId:
          type: string
          description: Location Id or Agency Id
          example: 6578278e879ad2646715ba9c
        altType:
          type: string
          enum:
          - location
        name:
          type: string
          description: Name of the invoice
          example: New Invoice
        schedule:
          $ref: '#/components/schemas/ScheduleOptionsDto'
        invoices:
          description: List of invoices
          type: array
          items:
            $ref: '#/components/schemas/DefaultInvoiceResponseDto'
        businessDetails:
          description: Business Details
          example:
            name: Alex
            address:
              addressLine1: 9931 Beechwood
              city: St. Houston
              state: TX
              countryCode: USA
              postalCode: 559-6993
            phoneNo: +1-214-559-6993
            website: www.example.com
          allOf:
          - $ref: '#/components/schemas/BusinessDetailsDto'
        currency:
          type: string
          description: Currency
          example: USD
        contactDetails:
          description: Contact Details
          example:
            id: c6tZZU0rJBf30ZXx9Gli
            phoneNo: +1-214-559-6993
            email: alex@example.com
            customFields: []
            name: Alex
            address:
              countryCode: US
          allOf:
          - $ref: '#/components/schemas/ContactDetailsDto'
        discount:
          description: Discount
          example:
            type: percentage
            value: 0
          allOf:
          - $ref: '#/components/schemas/DiscountDto'
        items:
          description: Invoice Items
          example:
          - taxes: []
            _id: c6tZZU0rJBf30ZXx9Gli
            productId: c6tZZU0rJBf30ZXx9Gli
            priceId: c6tZZU0rJBf30ZXx9Gli
            currency: USD
            name: Macbook Pro
            qty: 1
            amount: 999
          type: array
          items:
            type: string
        total:
          type: number
          description: Total Amount
          example: 999
        title:
          type: string
          description: Title
          example: INVOICE
        termsNotes:
          type: string
          description: Terms notes
          example: Confidential
        compiledTermsNotes:
          type: string
          description: Compiled terms notes
          example: Confidential
        createdAt:
          type: string
          description: created at
          example: '2023-12-12T09:27:42.355Z'
        updatedAt:
          type: string
          description: updated at
          example: '2023-12-12T09:27:42.355Z'
      required:
      - _id
      - status
      - liveMode
      - altId
      - altType
      - name
      - invoices
      - businessDetails
      - currency
      - contactDetails
      - items
      - total
      - title
      - termsNotes
      - compiledTermsNotes
      - createdAt
      - updatedAt
    CreateInvoiceScheduleResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: Schedule Id
          example: 6578278e879ad2646715ba9c
        status:
          type: object
          description: Schedule Status
          example: draft
        liveMode:
          type: boolean
          description: Live Mode
          example: false
        altId:
          type: string
          description: Location Id or Agency Id
          example: 6578278e879ad2646715ba9c
        altType:
          type: string
          enum:
          - location
        name:
          type: string
          description: Name of the invoice
          example: New Invoice
        schedule:
          $ref: '#/components/schemas/ScheduleOptionsDto'
        invoices:
          description: List of invoices
          type: array
          items:
            $ref: '#/components/schemas/DefaultInvoiceResponseDto'
        businessDetails:
          description: Business Details
          example:
            name: Alex
            address:
              addressLine1: 9931 Beechwood
              city: St. Houston
              state: TX
              countryCode: USA
              postalCode: 559-6993
            phoneNo: +1-214-559-6993
            website: www.example.com
          allOf:
          - $ref: '#/components/schemas/BusinessDetailsDto'
        currency:
          type: string
          description: Currency
          example: USD
        contactDetails:
          description: Contact Details
          example:
            id: c6tZZU0rJBf30ZXx9Gli
            phoneNo: +1-214-559-6993
            email: alex@example.com
            customFields: []
            name: Alex
            address:
              countryCode: US
          allOf:
          - $ref: '#/components/schemas/ContactDetailsDto'
        discount:
          description: Discount
          example:
            type: percentage
            value: 0
          allOf:
          - $ref: '#/components/schemas/DiscountDto'
        items:
          description: Invoice Items
          example:
          - taxes: []
            _id: c6tZZU0rJBf30ZXx9Gli
            productId: c6tZZU0rJBf30ZXx9Gli
            priceId: c6tZZU0rJBf30ZXx9Gli
            currency: USD
            name: Macbook Pro
            qty: 1
            amount: 999
          type: array
          items:
            type: string
        total:
          type: number
          description: Total Amount
          example: 999
        title:
          type: string
          description: Title
          example: INVOICE
        termsNotes:
          type: string
          description: Terms notes
          example: Confidential
        compiledTermsNotes:
          type: string
          description: Compiled terms notes
          example: Confidential
        createdAt:
          type: string
          description: created at
          example: '2023-12-12T09:27:42.355Z'
        updatedAt:
          type: string
          description: updated at
          example: '2023-12-12T09:27:42.355Z'
      required:
      - _id
      - status
      - liveMode
      - altId
      - altType
      - name
      - invoices
      - businessDetails
      - currency
      - contactDetails
      - items
      - total
      - title
      - termsNotes
      - compiledTermsNotes
      - createdAt
      - updatedAt
    PaymentMethodDto:
      type: object
      properties:
        stripe:
          description: Payment Method
          allOf:
          - $ref: '#/components/schemas/StripePaymentMethodDto'
      required:
      - stripe
    USBankAccountDto:
      type: object
      properties:
        bank_name:
          type: string
        last4:
          type: string
      required:
      - bank_name
      - last4
    BecsDirectDebitDTO:
      type: object
      properties:
        bsb_number:
          type: string
        last4:
          type: string
      required:
      - bsb_number
      - last4
    AutoPaymentInvoiceScheduleResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: Schedule Id
          example: 6578278e879ad2646715ba9c
        status:
          type: object
          description: Schedule Status
          example: draft
        liveMode:
          type: boolean
          description: Live Mode
          example: false
        altId:
          type: string
          description: Location Id or Agency Id
          example: 6578278e879ad2646715ba9c
        altType:
          type: string
          enum:
          - location
        name:
          type: string
          description: Name of the invoice
          example: New Invoice
        schedule:
          $ref: '#/components/schemas/ScheduleOptionsDto'
        invoices:
          description: List of invoices
          type: array
          items:
            $ref: '#/components/schemas/DefaultInvoiceResponseDto'
        businessDetails:
          description: Business Details
          example:
            name: Alex
            address:
              addressLine1: 9931 Beechwood
              city: St. Houston
              state: TX
              countryCode: USA
              postalCode: 559-6993
            phoneNo: +1-214-559-6993
            website: www.example.com
          allOf:
          - $ref: '#/components/schemas/BusinessDetailsDto'
        currency:
          type: string
          description: Currency
          example: USD
        contactDetails:
          description: Contact Details
          example:
            id: c6tZZU0rJBf30ZXx9Gli
            phoneNo: +1-214-559-6993
            email: alex@example.com
            customFields: []
            name: Alex
            address:
              countryCode: US
          allOf:
          - $ref: '#/components/schemas/ContactDetailsDto'
        discount:
          description: Discount
          example:
            type: percentage
            value: 0
          allOf:
          - $ref: '#/components/schemas/DiscountDto'
        items:
          description: Invoice Items
