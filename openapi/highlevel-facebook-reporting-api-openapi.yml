openapi: 3.2.0
info:
  title: Ad Manager Facebook Reporting API
  description: Documentation for Ad-publishing API
  version: '1.0'
  contact: {}
servers:
- url: https://services.leadconnectorhq.com
tags:
- name: Facebook Reporting
  description: Documentation for Ad-publishing API
paths:
  /ad-publishing/facebook/reporting:
    get:
      operationId: fb-get-reporting
      summary: Get reporting data
      description: Retrieve aggregated Facebook ad reporting metrics for a location
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
          example: '2021-07-28'
      - name: locationId
        required: true
        in: query
        description: Location identifier
        schema:
          example: fRMewNQIxSyZ5R4nQyit
          type: string
      - name: groupBy
        required: true
        in: query
        description: Time grouping interval
        schema:
          example: month
          enum:
          - day
          - week
          - month
          type: string
      - name: startDate
        required: true
        in: query
        description: Report start date
        schema:
          example: '2022-01-11'
          type: string
      - name: endDate
        required: true
        in: query
        description: Report end date
        schema:
          example: '2022-01-31'
          type: string
      - name: type
        required: true
        in: query
        description: Integration source type
        schema:
          example: AD_MANAGER or INTEGRATION
          enum:
          - AD_MANAGER
          - INTEGRATION
          type: string
      - name: fields
        required: true
        in: query
        explode: false
        description: Comma-separated reporting fields
        schema:
          type: array
          items:
            type: string
            enum:
            - impressions
            - clicks
            - spend
            - cpc
            - cost_per_conversion
            - conversions
            - cpm
            - reach
            - frequency
      responses:
        '200':
          description: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      security:
      - bearer:
        - adPublishing.readonly
      tags:
      - Facebook Reporting
  /ad-publishing/facebook/reporting/campaign/{campaignId}:
    get:
      operationId: fb-get-campaign-reporting
      summary: Get campaign reporting
      description: Retrieve reporting metrics for a specific Facebook campaign
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
          example: '2021-07-28'
      - name: campaignId
        required: true
        in: path
        description: Campaign identifier
        schema:
          example: '120208142050850608'
          type: string
      - name: locationId
        required: true
        in: query
        description: Location identifier
        schema:
          example: fRMewNQIxSyZ5R4nQyit
          type: string
      - name: startDate
        required: true
        in: query
        description: Report start date
        schema:
          example: '2022-01-11'
          type: string
      - name: endDate
        required: true
        in: query
        description: Report end date
        schema:
          example: '2022-01-31'
          type: string
      responses:
        '200':
          description: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      security:
      - bearer:
        - adPublishing.readonly
      tags:
      - Facebook Reporting
  /ad-publishing/facebook/reporting/list:
    get:
      operationId: fb-get-reporting-list
      summary: Get reporting list
      description: Retrieve a list of Facebook campaigns, adsets, or ads with reporting data
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
          example: '2021-07-28'
      - name: locationId
        required: true
        in: query
        description: Location identifier
        schema:
          example: fRMewNQIxSyZ5R4nQyit
          type: string
      - name: listType
        required: true
        in: query
        description: Reporting list type
        schema:
          example: campaigns
          type: string
      - name: startDate
        required: true
        in: query
        description: Report start date
        schema:
          example: '2022-01-11'
          type: string
      - name: endDate
        required: true
        in: query
        description: Report end date
        schema:
          example: '2022-01-31'
          type: string
      - name: campaignId
        required: true
        in: query
        description: Campaign identifier
        schema:
          example: '196684453527082'
          type: string
      - name: type
        required: true
        in: query
        description: Integration source type
        schema:
          example: INTEGRATION
          enum:
          - AD_MANAGER
          - INTEGRATION
          type: string
      responses:
        '200':
          description: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      security:
      - bearer:
        - adPublishing.readonly
      tags:
      - Facebook Reporting
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Sub-Account (OR) Private Integration Token of Sub-Account.
      type: http
    Location-Access:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Sub-Account (OR) Private Integration Token of Sub-Account.
      type: http
    Location-Access-Only:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Sub-Account.
      type: http
    Agency-Access:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Agency (OR) Private Integration Token of Agency.
      type: http
    Agency-Access-Only:
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      in: header
      description: Use the Access Token generated with user type as Agency.
      type: http
x-tagGroups:
  name: Ad Manager
  tags:
  - Facebook Integration
  - Facebook Ads
  - Facebook Reporting
  - Google Integration
  - Google Ads
  - Google Reporting
  - LinkedIn Integration
  - LinkedIn Ads
  - LinkedIn Reporting
  - Reselling
