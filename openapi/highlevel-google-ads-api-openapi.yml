        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-07-28'
          example: '2021-07-28'
      - name: locationId
        required: true
        in: query
        description: Location identifier
        schema:
          example: loc_abc123
          type: string
      - name: type
        required: false
        in: query
        description: Integration type
        schema:
          example: AD_MANAGER
          enum:
          - AD_MANAGER
          - AD_WORDS
          type: string
      - name: conversionType
        required: false
        in: query
        description: Conversion type
        schema:
          example: WEBPAGE
          type: string
      - name: category
        required: false
        in: query
        description: Conversion category
        schema:
          example: PURCHASE
          type: string
      - name: startDate
        required: false
        in: query
        description: Filter start date
        schema:
          example: '2024-01-01'
          type: string
      - name: endDate
        required: false
        in: query
        description: Filter end date
        schema:
          example: '2024-12-31'
          type: string
      responses:
        '200':
          description: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
      security:
      - bearer:
        - adPublishing.readonly
      tags:
      - Google Ads
