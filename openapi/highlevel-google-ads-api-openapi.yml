components:
  schemas:
    GeoLatLngDTO:
      type: object
      properties:
        lat:
          type: number
          description: Latitude
        lng:
          type: number
          description: Longitude
    GoogleKeywordItemDTO:
      type: object
      properties:
        keyword:
          type: string
          description: Keyword text
        matchType:
          type: string
          description: Match type (BROAD, PHRASE, EXACT)
      required:
      - keyword
      - matchType
    KeywordSuggestionDTO:
      type: object
      properties:
        url:
          type: string
          description: Target URL
          example: https://example.com
        languageCode:
          type: string
          description: Language code
          example: en
        locations:
          description: Target locations
          example:
          - US
          - CA
          type: array
          items:
            type: string
        keywords:
          description: Seed keywords
          example:
          - marketing
          type: array
          items:
            type: string
      required:
      - url
    UpsertConversionDTO:
      type: object
      properties:
        locationId:
          type: string
          description: Location identifier
          example: loc_abc123
        conversionId:
          type: string
          description: Conversion identifier
          example: conv_456
        name:
          type: string
          description: Conversion name
          example: Purchase Conversion
        type:
          type: string
          description: Conversion type
          example: WEBPAGE
          enum:
          - UPLOAD_CLICKS
          - UPLOAD_CALLS
          - WEBPAGE
          - LEAD_FORM_SUBMIT
        category:
          type: string
          description: Conversion category
          example: PURCHASE
        valueSettings:
          description: Value settings that control how monetary value is attributed to conversions
          example:
            defaultValue: '10.00'
            defaultCurrencyCode: USD
            alwaysUseDefaultValue: false
          allOf:
          - $ref: '#/components/schemas/ConversionValueSettings'
        countingType:
          type: string
          description: How conversions are counted per interaction
          example: ONE_PER_CLICK
          enum:
          - ONE_PER_CLICK
          - MANY_PER_CLICK
        attributionModel:
          type: string
          description: Attribution model used to credit conversions
          example: GOOGLE_ADS_LAST_CLICK
          enum:
          - GOOGLE_SEARCH_ATTRIBUTION_DATA_DRIVEN
          - GOOGLE_ADS_LAST_CLICK
        clickThroughWindow:
          type: number
          description: Click-through conversion window in days
          example: 30
      required:
      - locationId
      - name
      - type
      - category
      - valueSettings
      - countingType
      - attributionModel
      - clickThroughWindow
    GoogleBiddingStrategyDTO:
      type: object
      properties:
        type:
          type: string
          description: Bidding strategy type
        value:
          type: number
          description: Bid value in micros
    MemberDTO:
      type: object
      properties:
        memberType:
          type: string
          description: Member type
          example: KEYWORD
          enum:
          - KEYWORD
          - URL
          - APP
        keyword:
          type: string
          description: Keyword value
          example: marketing
        url:
          type: string
          description: URL value
          example: https://example.com
        app:
          type: string
          description: App identifier
          example: com.example.app
      required:
      - memberType
    GoogleAdGroupAudienceDTO:
      type: object
      properties:
        geo_locations:
          description: Geo-location targeting
          type: array
          items:
            $ref: '#/components/schemas/GoogleGeoLocationDTO'
        locales:
          description: Language/locale targeting
          type: array
          items:
            $ref: '#/components/schemas/GoogleLocaleDTO'
    ConversionValueSettings:
      type: object
      properties:
        defaultValue:
          type: number
          description: Default monetary value assigned to each conversion
          example: 10
        defaultCurrencyCode:
          type: string
          description: ISO 4217 currency code for the default value
          example: USD
        alwaysUseDefaultValue:
          type: boolean
          description: When true, always uses the default value even if a transaction-specific value is provided
          example: false
      required:
      - defaultValue
      - defaultCurrencyCode
      - alwaysUseDefaultValue
    GoogleYouTubeVideoLinkDTO:
      type: object
      properties:
        youtubeVideoId:
          type: string
          description: YouTube video ID
      required:
      - youtubeVideoId
    GoogleSegmentTargetDTO:
      type: object
      properties:
        type:
          type: string
          description: Segment type
        id:
          type: string
          description: Segment identifier
      required:
      - type
      - id
    LeadFormAssetPayloadDTO:
      type: object
      properties:
        resourceName:
          type: string
          description: Google Ads resource name for an existing lead form asset
          example: customers/123/assets/456
        headline:
          type: string
          description: Lead form headline
          example: Get a free quote
        description:
          type: string
          description: Lead form description
          example: Fill out this form and we will contact you within 24 hours
        businessName:
          type: string
          description: Business name shown on the form
          example: Acme Corp
        privacyPolicyUrl:
          type: string
          description: Privacy policy URL
          example: https://example.com/privacy
        fields:
          description: Form fields to collect user input
          example:
          - inputType: FULL_NAME
            singleChoiceAnswers: []
          - inputType: EMAIL
            singleChoiceAnswers: []
          type: array
          items:
            $ref: '#/components/schemas/LeadFormFieldDTO'
        callToActionType:
          type: string
          description: Call to action button type
          example: GET_QUOTE
          enum:
          - LEARN_MORE
          - GET_QUOTE
          - APPLY_NOW
          - SIGN_UP
          - CONTACT_US
          - SUBSCRIBE
          - DOWNLOAD
          - BOOK_NOW
          - GET_OFFER
          - REGISTER
          - GET_INFO
          - REQUEST_DEMO
          - JOIN_NOW
          - GET_STARTED
          - VISIT_SITE
        callToActionDescription:
          type: string
          description: Description text for the CTA button
          example: Request your free quote now
        backgroundImageAsset:
          type: string
          description: Background image asset resource name
          example: customers/123/assets/789
        desiredIntent:
          type: string
          description: Desired lead intent level
          example: HIGH_INTENT
          enum:
          - LOW_INTENT
          - HIGH_INTENT
        customQuestionFields:
          description: Custom question fields appended after standard fields
          type: array
          items:
            $ref: '#/components/schemas/CustomQuestionFieldDTO'
        postSubmitHeadline:
          type: string
          description: Headline shown after form submission
          example: Thank you!
        postSubmitDescription:
          type: string
          description: Description shown after form submission
          example: We will be in touch shortly
        postSubmitCallToActionType:
          type: string
          description: Post-submit CTA button type
          example: VISIT_SITE
          enum:
          - VISIT_SITE
          - DOWNLOAD
          - LEARN_MORE
          - SHOP_NOW
        finalUrls:
          type: string
          description: Final URL shown after form submission
          example: https://example.com/thank-you
      required:
      - headline
      - description
      - businessName
      - privacyPolicyUrl
      - fields
      - callToActionType
    LeadFormFieldDTO:
      type: object
      properties:
        inputType:
          type: string
          description: Field input type from Google Ads LeadFormFieldUserInputType
          example: FULL_NAME
        singleChoiceAnswers:
          description: Single-choice answer options for the field
          example:
          - key: option_1
            value: 'Yes'
          type: array
          items:
            type: string
      required:
      - inputType
    RuleDTO:
      type: object
      properties:
        ruleItemGroups:
          description: List of rule item groups
          type: array
          items:
            $ref: '#/components/schemas/RuleItemGroupDTO'
      required:
      - ruleItemGroups
    GoogleBudgetDTO:
      type: object
      properties:
        budgetType:
          type: string
          description: Budget type
          enum:
          - DAILY
          - LIFETIME
        amount:
          type: number
          description: Budget amount in micros
          example: 5000
        scheduleStartDate:
          type: string
          description: Schedule start date
          example: '2024-01-01'
        scheduleEndDate:
          type: string
          description: Schedule end date
          example: '2024-12-31'
    GoogleCampaignAudienceDTO:
      type: object
      properties:
        geo_locations:
          description: Geo-location targeting
          type: array
          items:
            $ref: '#/components/schemas/GoogleGeoLocationDTO'
        locales:
          description: Language/locale targeting
          type: array
          items:
            $ref: '#/components/schemas/GoogleLocaleDTO'
        gender:
          description: Gender targeting
          type: array
          items:
            $ref: '#/components/schemas/GoogleDemographicTargetDTO'
        ageRange:
          description: Age range targeting
          type: array
          items:
            $ref: '#/components/schemas/GoogleDemographicTargetDTO'
        segments:
          description: Audience segment targeting
          type: array
          items:
            $ref: '#/components/schemas/GoogleSegmentTargetDTO'
        targetInterests:
          description: Interest-based targeting
          allOf:
          - $ref: '#/components/schemas/GoogleTargetInterestsDTO'
    GeoAddressComponentDTO:
      type: object
      properties:
        long_name:
          type: string
          description: Full name of the address component
        short_name:
          type: string
          description: Abbreviated name of the address component
        types:
          description: Address component types
          example:
          - locality
          - political
          type: array
          items:
            type: string
    SitelinkAssetPayloadDTO:
      type: object
      properties:
        resourceName:
          type: string
          description: Google Ads resource name for an existing sitelink asset
          example: customers/123/assets/456
        linkText:
          type: string
          description: Sitelink display text
          example: Pricing
        finalUrls:
          type: string
          description: Final landing page URL
          example: https://example.com/pricing
        description1:
          type: string
          description: First description line
          example: See our plans and pricing
        description2:
          type: string
          description: Second description line
          example: Starting at $9/month
        startDate:
          type: string
          description: Start date for the sitelink (YYYY-MM-DD)
          example: '2024-01-01'
        endDate:
          type: string
          description: End date for the sitelink (YYYY-MM-DD)
          example: '2024-12-31'
        adScheduleTargets:
          description: Ad schedule targets restricting when the sitelink is shown
          type: array
          items:
            $ref: '#/components/schemas/AdScheduleTargetDTO'
      required:
      - linkText
      - finalUrls
    GoogleAdScheduleDTO:
      type: object
      properties:
        dayOfWeek:
          type: string
          description: Day of week
          enum:
          - FRIDAY
          - MONDAY
          - SATURDAY
          - SUNDAY
          - THURSDAY
          - TUESDAY
          - UNKNOWN
          - UNSPECIFIED
          - WEDNESDAY
          - ALL_DAYS
          - MONDAY_TO_FRIDAY
          - SATURDAY_AND_SUNDAY
        from:
          type: string
          description: Start time (HH:MM)
          example: 09:00
        to:
          type: string
          description: End time (HH:MM)
          example: '17:00'
      required:
      - dayOfWeek
      - from
      - to
    CustomQuestionFieldDTO:
      type: object
      properties:
        customQuestionText:
          type: string
          description: Custom question text shown to the user
          example: What service are you interested in?
        singleChoiceAnswers:
          description: Answer choices for the custom question
          example:
          - answerTexts:
            - Web Design
            - SEO
            - PPC
          type: array
          items:
            type: string
      required:
      - customQuestionText
      - singleChoiceAnswers
    AdScheduleTargetDTO:
      type: object
      properties:
        startMinute:
          type: string
          description: Minute mark the schedule starts at
          example: ZERO
          enum:
          - ZERO
          - FIFTEEN
          - THIRTY
          - FORTY_FIVE
        endMinute:
          type: string
          description: Minute mark the schedule ends at
          example: ZERO
          enum:
          - ZERO
          - FIFTEEN
          - THIRTY
          - FORTY_FIVE
        dayOfWeek:
          type: string
          description: Day of the week for this schedule
          example: MONDAY
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
        startHour:
          type: number
          description: Start hour in 24h format (0-23)
          example: 9
        endHour:
          type: number
          description: End hour in 24h format (0-23)
          example: 17
      required:
      - startMinute
      - endMinute
      - dayOfWeek
      - startHour
      - endHour
    GoogleMediaDTO:
      type: object
      properties:
        type:
          type: string
          description: Media type
          enum:
          - IMAGE
        src:
          type: string
          description: Media source URL
          example: https://example.com/image.jpg
        isLogo:
          type: boolean
          description: Is logo flag
          example: false
        error:
          type: string
          description: Error message if media failed
        url:
          type: string
          description: Public URL of the media
        imageType:
          type: string
          description: Image type classification
    UpsertSegmentDTO:
      type: object
      properties:
        name:
          type: string
          description: Segment name
          example: My Segment
        description:
          type: string
          description: Segment description
          example: Target audience segment
        members:
          description: Segment members — keywords, URLs, or apps that define the custom segment
          example:
          - memberType: KEYWORD
            keyword: digital marketing
          - memberType: URL
            url: https://example.com
          - memberType: APP
            app: com.example.app
          type: array
          items:
            $ref: '#/components/schemas/MemberDTO'
        status:
          type: string
          description: Segment status
          example: ENABLED
        type:
          type: string
          description: Segment type
          example: CUSTOM_SEGMENTS
        id:
          type: string
          description: Segment identifier
          example: seg_123
        membershipStatus:
          type: string
          description: Membership status
          example: OPEN
        ruleBasedUserList:
          description: Rule-based user list config
          allOf:
          - $ref: '#/components/schemas/RuleBasedUserListDTO'
        membershipLifeSpan:
          type: number
          description: Membership life span
          example: 30
        seedUserListIds:
          description: Seed user list IDs
          example:
          - list_1
          type: array
          items:
            type: string
        countryCodes:
          description: Country codes
          example:
          - US
          - CA
          type: array
          items:
            type: string
        expansionLevel:
          type: string
          description: Expansion level
          example: BALANCED
          enum:
          - BALANCED
          - BROAD
          - NARROW
      required:
      - name
    StringRuleItemDTO:
      type: object
      properties:
        operator:
          type: string
          description: Rule operator
          example: CONTAINS
        value:
          type: string
          description: Rule value
          example: /products
      required:
      - operator
      - value
    GoogleGeoLocationDTO:
      type: object
      properties:
        key:
          type: string
          description: Geo target constant resource name
        id:
          type: string
          description: Location identifier (place_id)
        name:
          type: string
          description: Location display name
        country_name:
          type: string
          description: Country name
        type:
          type: string
          description: Location type (city, region, country, address, etc.)
        radius:
          type: number
          description: Radius for proximity targeting
        radiusUnit:
          type: string
          description: Radius unit
          enum:
          - km
          - mi
        selectionType:
          type: string
          description: Include or exclude this location
          enum:
          - include
          - exclude
        resourceName:
          type: string
          description: Google Ads resource name
        place_id:
          type: string
          description: Google place ID
        formatted_address:
          type: string
          description: Full formatted address string
        geometry:
          description: Geometry data from Google Geocoding API
          allOf:
          - $ref: '#/components/schemas/GeoGeometryDTO'
        address_components:
          description: Address components from Google Geocoding API
          type: array
          items:
            $ref: '#/components/schemas/GeoAddressComponentDTO'
    GeoViewportDTO:
      type: object
      properties:
        northeast:
          description: Northeast corner of the viewport
          allOf:
          - $ref: '#/components/schemas/GeoLatLngDTO'
        southwest:
          description: Southwest corner of the viewport
          allOf:
          - $ref: '#/components/schemas/GeoLatLngDTO'
    GoogleCarouselCardDTO:
      type: object
      properties:
        headline:
          type: string
          description: Card headline
          example: Shop Now
        finalUrl:
          type: string
          description: Card final URL
          example: https://example.com
        callToActionLabel:
          type: string
          description: Call to action label
        media:
          description: Card media items
          type: array
          items:
            $ref: '#/components/schemas/GoogleMediaDTO'
    RuleItemDTO:
      type: object
      properties:
        name:
          type: string
          description: Rule item name
          enum:
          - url__
          - referrer__
          example: url__
        stringRuleItem:
          description: String rule item condition
          allOf:
          - $ref: '#/components/schemas/StringRuleItemDTO'
      required:
      - name
      - stringRuleItem
    GoogleKeywordsDTO:
      type: object
      properties:
        positives:
          description: Positive keywords
          type: array
          items:
            $ref: '#/components/schemas/GoogleKeywordItemDTO'
        negatives:
          description: Negative keywords
          type: array
          items:
            $ref: '#/components/schemas/GoogleKeywordItemDTO'
    GoogleLocaleDTO:
      type: object
      properties:
        name:
          type: string
          description: Language display name
        key:
          type: string
          description: Language key
        id:
