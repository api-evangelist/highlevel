        timezone:
          type: string
          example: Asia/Calcutta
        companyName:
          type: string
          example: DGS VolMAX
        phone:
          type: string
          example: '+18832327657'
        dnd:
          type: boolean
          example: true
        dndSettings:
          $ref: '#/components/schemas/DndSettingsSchema'
        type:
          type: string
          example: read
        source:
          type: string
          example: public api
        assignedTo:
          type: string
          example: ve9EPM428h8vShlRW1KT
        address1:
          type: string
          example: 3535 1st St N
        city:
          type: string
          example: ruDolomitebika
        state:
          type: string
          example: AL
        country:
          type: string
          example: US
        postalCode:
          type: string
          example: '35061'
        website:
          type: string
          example: https://www.tesla.com
        tags:
          example:
          - nisi sint commodo amet
          - consequat
          type: array
          items:
            type: string
        dateOfBirth:
          type: string
          example: Date format YYYY-MM-DD
        dateAdded:
          type: string
          example: '2021-07-02T05:18:26.704Z'
        dateUpdated:
          type: string
          example: '2021-07-02T05:18:26.704Z'
        attachments:
          type: string
        ssn:
          type: string
        keyword:
          type: string
          example: test
        firstNameLowerCase:
          type: string
          example: rubika
        fullNameLowerCase:
          type: string
          example: rubika deo
        lastNameLowerCase:
          type: string
          example: deo
        lastActivity:
          type: string
          example: '2021-07-16T11:39:30.564Z'
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldSchema'
        businessId:
          type: string
          example: 641c094001436dbc2081e642
        attributionSource:
          $ref: '#/components/schemas/AttributionSource'
        lastAttributionSource:
          $ref: '#/components/schemas/AttributionSource'
        visitorId:
          type: string
          description: visitorId is the Unique ID assigned to each Live chat visitor.
          example: ve9EPM428h8vShlRW1KT
    ContactsSearchSchema:
      type: object
      properties:
        id:
          type: string
          example: ocQHyuzHvysMo5N5VsXc
        locationId:
          type: string
          example: C2QujeCh8ZnC7al2InWR
        email:
          type: string
          example: JohnDeo@gmail.com
        timezone:
          type: string
          example: Asia/Calcutta
        country:
          type: string
          example: DE
        source:
          type: string
          example: xyz form
        dateAdded:
          type: string
          example: '2020-10-29T09:31:30.255Z'
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldSchema'
        tags:
          example:
          - nisi sint commodo amet
          - consequat
          type: array
          items:
            type: string
        businessId:
          type: string
          example: 641c094001436dbc2081e642
        attributions:
          type: array
          items:
            $ref: '#/components/schemas/AttributionSource'
        followers:
          example: 641c094001436dbc2081e642
          type: array
          items:
            type: string
    UpsertContactDto:
      type: object
      properties:
        firstName:
          type:
          - string
          - 'null'
          example: Rosan
        lastName:
          type:
          - string
          - 'null'
          example: Deo
        name:
          type:
          - string
          - 'null'
          example: Rosan Deo
        email:
          type:
          - string
          - 'null'
          example: rosan@deos.com
