openapi: 3.2.0
info:
  title: Highlevel Agents API
  version: '1.0'
  contact: {}
  description: 'Operations tagged Agents across 3 of this provider''s published API definitions: highlevel-agent-studio-openapi.json, highlevel-conversation-ai-openapi.json, highlevel-voice-ai-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://services.leadconnectorhq.com
tags:
- name: Agents
  description: Documentation for Agent Studio APIs
paths:
  /agent-studio/agent:
    post:
      operationId: createAgent
      summary: Create Agent
      description: Creates a new agent with staging version. The agent will be created with an initial staging version that can later be promoted to production.
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-04-15'
      - name: source
        required: false
        in: query
        schema:
          type: string
        example: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicAgentDTO'
      responses:
        '201':
          description: Agent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePublicAgentResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorDTO'
      tags:
      - Agents
      security:
      - Location-Access:
        - agent-studio.write
    get:
      operationId: getAgents
      summary: List Agents
      description: Lists all active agents for the specified location. locationId is required parameter to ensure optimal performance. Supports pagination using limit and offset. Optionally filter by isPublished=true to return only agents with a published production version.
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-04-15'
      - name: locationId
        required: true
        in: query
        schema:
          type: string
        example: C2QujeCh8ZnC7al2InWR
      - name: isPublished
        required: false
        in: query
        description: Optional filter to return only agents with a published production version
        schema:
          type: string
        example: 'true'
      - name: limit
        required: true
        in: query
        schema:
          type: string
        example: '20'
      - name: offset
        required: true
        in: query
        schema:
          type: string
        example: '0'
      - name: source
        required: false
        in: query
        schema:
          type: string
        example: api
      responses:
        '200':
          description: Agents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublishedAgentsResponseDTO'
        '400':
          description: Bad Request - locationId is required
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorDTO'
      tags:
      - Agents
      security:
      - Location-Access:
        - agent-studio.readonly
    servers:
    - url: https://services.leadconnectorhq.com
  /agent-studio/agent/versions/{versionId}:
    patch:
      operationId: updateAgentVersion
      summary: Update Agent
      description: Updates a specific agent version by versionId. Supports updating nodes, edges, variables, and configuration.
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-04-15'
      - name: versionId
        required: true
        in: path
        schema:
          type: string
        example: v1a2b3c4d5e6f7g8h9i0
      - name: source
        required: false
        in: query
        schema:
          type: string
        example: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicAgentVersionDTO'
      responses:
        '200':
          description: Version updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePublicAgentResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '404':
          description: Version not found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorDTO'
      tags:
      - Agents
      security:
      - Location-Access:
        - agent-studio.write
    servers:
    - url: https://services.leadconnectorhq.com
  /agent-studio/agent/{agentId}:
    patch:
      operationId: updateAgentMetadata
      summary: Update Agent Metadata
      description: Updates agent metadata such as name, description, and status.
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-04-15'
      - name: agentId
        required: true
        in: path
        schema:
          type: string
        example: p1q2r3s4t5u6v7w8x9y0z1a2
      - name: source
        required: false
        in: query
        schema:
          type: string
        example: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicAgentMetadataDTO'
      responses:
        '200':
          description: Agent metadata updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePublicAgentResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '404':
          description: Agent not found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorDTO'
      tags:
      - Agents
      security:
      - Location-Access:
        - agent-studio.write
    delete:
      operationId: deleteAgent
      summary: Delete Agent
      description: Deletes an agent and all its versions.
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-04-15'
      - name: agentId
        required: true
        in: path
        schema:
          type: string
        example: p1q2r3s4t5u6v7w8x9y0z1a2
      - name: locationId
        required: true
        in: query
        schema:
          type: string
        example: C2QujeCh8ZnC7al2InWR
      - name: source
        required: false
        in: query
        schema:
          type: string
        example: api
      responses:
        '200':
          description: Agent deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePublicAgentResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '404':
          description: Agent not found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorDTO'
      tags:
      - Agents
      security:
      - Location-Access:
        - agent-studio.write
    get:
      operationId: getAgentById
      summary: Get Agent
      description: Gets a specific agent by its ID for the specified location with all its versions. Returns complete agent metadata and all non-deleted versions (draft, staging, production). locationId is required parameter. The agent must have active status.
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-04-15'
      - name: agentId
        required: true
        in: path
        schema:
          type: string
        example: p1q2r3s4t5u6v7w8x9y0z1a2
      - name: locationId
        required: true
        in: query
        schema:
          type: string
        example: C2QujeCh8ZnC7al2InWR
      - name: source
        required: false
        in: query
        schema:
          type: string
        example: api
      responses:
        '200':
          description: Agent retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentByIdResponseDTO'
        '400':
          description: Bad Request - locationId is required
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/BadRequestDTO
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '404':
          description: Agent not found or not available
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorDTO'
      tags:
      - Agents
      security:
      - Location-Access:
        - agent-studio.readonly
    servers:
    - url: https://services.leadconnectorhq.com
  /agent-studio/agent/versions/{versionId}/publish:
    post:
      operationId: promoteAndPublish
      summary: Promote to Production
      description: Promotes a draft version to production.
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-04-15'
      - name: versionId
        required: true
        in: path
        schema:
          type: string
        example: v1a2b3c4d5e6f7g8h9i0
      - name: source
        required: false
        in: query
        schema:
          type: string
        example: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteAndPublishDTO'
      responses:
        '200':
          description: Version promoted and published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoteAndPublishResponseDTO'
        '400':
          description: Bad Request - Only draft versions can be promoted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '404':
          description: Version not found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorDTO'
      tags:
      - Agents
      security:
      - Location-Access:
        - agent-studio.write
    servers:
    - url: https://services.leadconnectorhq.com
  /agent-studio/agent/{agentId}/execute:
    post:
      operationId: executeAgent
      summary: Execute Agent
      description: 'Executes the specified agent and returns a non-streaming JSON response with the complete agent output. The agent must be in active status and belong to the specified location. locationId is required in the request body.


        **Session Management:**

        - For the first message in a new session, do not include the `executionId` in the request payload.

        - The API will return an `executionId` along with the agent response, which uniquely identifies this conversation session.

        - To continue the conversation within the same session, include the `executionId` from the previous response in subsequent requests. This allows the agent to maintain conversation context and history across multiple interactions.'
      parameters:
      - name: Version
        in: header
        description: API Version
        required: true
        schema:
          type: string
          enum:
          - '2021-04-15'
      - name: agentId
        required: true
        in: path
        schema:
          type: string
        example: p1q2r3s4t5u6v7w8x9y0z1a2
      - name: source
        required: false
        in: query
        schema:
          type: string
        example: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutePublicAgentDTO'
      responses:
        '200':
          description: Agent executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutePublicAgentResponseDTO'
        '400':
          description: Agent is not active or invalid request - locationId is required
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnauthorizedDTO
        '403':
          description: User does not have required scopes to execute this agent
        '404':
          description: Agent not found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: ../common/common-schemas.json#/components/schemas/UnprocessableDTO
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorDTO'
      tags:
      - Agents
      security:
      - Location-Access:
        - agent-studio.write
    servers:
    - url: https://services.leadconnectorhq.com
  /agent-studio/public-api/agents:
    get:
      operationId: getAgents-deprecated
