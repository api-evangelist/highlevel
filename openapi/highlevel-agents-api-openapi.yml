              updatedAt: '2026-03-06T10:37:01.079Z'
              deleted: false
              storedInBucket: true
              bucketFilePath: agent-definitions/5DP4iH6HLkQsiKESj6rh/vEoIigWSAw1BQA9DEchD/d6a6792d-0d50-4e8f-9c3b-ecd8096d0bdd/3f9d9ab7-5ca4-4e64-8472-eab9e77a0fe3.json
